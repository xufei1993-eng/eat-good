<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>吃对饭 · 内容后台</title>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.27.1/cloudbase.full.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26332f;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}.shell{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font-size:12px;color:#2e8f88;letter-spacing:1px}.top h1{margin:6px 0 0;font-size:28px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.toolbar button,.form-actions button,.pagination button{border:1px solid #d7e0d8;background:white;padding:10px 14px;border-radius:6px;cursor:pointer}.tabs button.active,.primary{background:#2e8f88!important;color:white;border-color:#2e8f88!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.panel{background:#fff;border:1px solid #dfe7df;border-radius:8px;padding:18px;box-shadow:0 2px 8px #26332f0b}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d7e0d8;border-radius:6px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;text-align:left;border-bottom:1px solid #edf1ed;font-size:13px}.muted{color:#728078}.status{font-size:12px;padding:4px 7px;border-radius:4px;background:#e5f3e8;color:#28774c}.status.offline{background:#f3ece5;color:#9b6640}.row-actions button{border:0;background:none;color:#2e8f88;cursor:pointer;padding:4px}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.pagination select{padding:8px;border:1px solid #d7e0d8;border-radius:6px;background:white}.form{display:grid;gap:10px}.form label{font-size:12px;color:#5b6961;display:grid;gap:5px}.form input,.form textarea,.form select{font:inherit;border:1px solid #d7e0d8;border-radius:5px;padding:9px;background:#fff}.image-preview{width:100%;height:120px;object-fit:cover;border:1px solid #d7e0d8;border-radius:5px;background:#f4f6f1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.notice{padding:10px;background:#fff8e8;color:#806b37;border-radius:5px;font-size:13px;margin-bottom:12px}@media(max-width:850px){.shell{padding:16px}.layout{grid-template-columns:1fr}.top{display:block}.table th:nth-child(3),.table td:nth-child(3){display:none}}
    #importBuiltin{display:none!important}
  </style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">NUTRITION CONTENT</div><h1>内容管理后台</h1></div><span id="user" class="muted">未登录</span></header><div id="notice" class="notice">正在连接云环境...</div><nav class="tabs"><button class="active" data-type="dish">菜品库</button><button data-type="food">食物库</button></nav><section class="layout"><div class="panel"><div class="toolbar"><input id="keyword" placeholder="搜索名称、别名或食材"><select id="cuisineFilter"><option value="">全部菜系</option><option>家常菜</option><option>川菜</option><option>粤菜</option><option>江浙菜</option><option>西北菜</option><option>东北菜</option><option>日韩料理</option><option>轻食</option><option>烧烤</option><option>粉面</option><option>海鲜</option></select><select id="statusFilter"><option value="all">全部状态</option><option value="online">已上架</option><option value="offline">已下架</option></select><button id="refresh">刷新</button><button id="importBuiltin">导入 3000 道菜</button><button class="primary" id="newItem">新增</button></div><table class="table"><thead><tr><th>名称</th><th>分类/菜系</th><th>营养</th><th>状态</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="pagination"><span id="pageInfo" class="muted">第 1 页</span><select id="pageSize"><option>10</option><option selected>20</option><option>50</option><option>100</option></select><button id="prevPage">上一页</button><button id="nextPage">下一页</button></div></div><aside class="panel"><h2 id="formTitle">新增菜品</h2><form id="form" class="form"><label>名称<input required name="name"></label><label>别名<input name="aliases" placeholder="用逗号分隔"></label><div class="grid2"><label>分类<input name="category"></label><label>菜系<input name="cuisine"></label></div><div class="grid2"><label>餐次<select name="slot"><option value="all">全部</option><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="dinner">晚餐</option></select></label><label>计量单位<select name="measureUnit"><option value="g">克（g）</option><option value="ml">毫升（ml）</option></select></label></div><div class="grid2"><label>标准份量<input type="number" min="0.1" step="0.1" name="servingAmount" value="100"></label><label>份量名称<input name="servingUnit" value="标准份"></label></div><div class="grid2"><label>该标准份热量(kcal)<input type="number" min="0" name="kcal" value="0"></label><label>该标准份蛋白质(g)<input type="number" min="0" step="0.1" name="protein" value="0"></label></div><div class="grid2"><label>该标准份碳水(g)<input type="number" min="0" step="0.1" name="carbs" value="0"></label><label>该标准份脂肪(g)<input type="number" min="0" step="0.1" name="fat" value="0"></label></div><div class="grid2"><label>该标准份纤维(g)<input type="number" min="0" step="0.1" name="fiber" value="0"></label></div><label>说明/食材组成<textarea rows="3" name="description"></textarea></label><label>图片 URL<input name="imageUrl" placeholder="填写图片地址，或选择图片上传"></label><label>上传/替换图片<input id="imageFile" type="file" accept=".jpg,.jpeg,.png,.webp"></label><img id="imagePreview" class="image-preview" alt="图片预览" hidden><label>标签<input name="tags" placeholder="孕期安全,高蛋白"></label><label>过敏原<input name="allergens" placeholder="乳制品,花生"></label><div class="form-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></aside></section></main>
<section id="settingsPanel" class="panel" hidden><h2>拍照次数设置</h2><p class="muted">控制每个用户每月可使用拍照识别的次数。</p><label>每月拍照次数<input id="monthlyPhotoLimit" type="number" min="0" max="999" step="1" value="5"></label><button class="primary" id="saveSettings">保存设置</button><span id="settingsStatus" class="muted"></span></section><script>
const ENV_ID='cloudbase-d6gufos2q690df861';let type='dish',editing=null,page=1,pageSize=20,total=0,adminToken=sessionStorage.getItem('catalogAdminToken')||'';const app=cloudbase.init({env:ENV_ID,region:'ap-shanghai'});
const $=s=>document.querySelector(s), notice=$('#notice');
const settingsButton=document.createElement('button');settingsButton.textContent='拍照设置';settingsButton.onclick=()=>{const panel=$('#settingsPanel');panel.hidden=!panel.hidden;if(!panel.hidden)loadSettings()};document.querySelector('.tabs').appendChild(settingsButton);
async function loadSettings(){const r=await call({action:'getSettings'});$('#monthlyPhotoLimit').value=r.settings?.monthlyPhotoLimit ?? 5}
$('#saveSettings').onclick=async()=>{if(!adminToken){adminToken=prompt('请输入内容后台管理密钥')||'';if(adminToken)sessionStorage.setItem('catalogAdminToken',adminToken)}const r=await call({action:'saveSettings',settings:{monthlyPhotoLimit:Number($('#monthlyPhotoLimit').value)}});$('#settingsStatus').textContent=r.ok?'已保存':'保存失败'};
function errorText(error){const raw=[error&&error.message,error&&error.code,error&&error.error].filter(Boolean).join(' · ');const request=error&&error.requestId?` 请求 ID：${error.requestId}`:'';if(/domain|cors|origin|非法来源/i.test(raw))return `连接失败：请在 CloudBase「环境设置 → 安全来源」添加 localhost:8080。${request}`;if(/anonymous|匿名|unimplemented/i.test(raw))return `连接失败：请在 CloudBase「身份认证 → 登录方式」开启匿名登录（v2）。${request}`;return `连接失败：${raw||'无法调用 catalog 云函数。'}${request}`}
function withTimeout(promise,ms=10000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('连接超时，请检查 Web 安全来源和匿名登录配置')),ms))])}
function call(data){if(['save','toggle','bulkUpsert','uploadImage'].includes(data.action)&&!adminToken){adminToken=prompt('请输入内容后台管理密钥')||'';if(adminToken)sessionStorage.setItem('catalogAdminToken',adminToken)}return app.callFunction({name:'catalog',data:{...data,adminToken},parse:true}).then(response=>{if(response&&response.code){const error=new Error(response.message||response.code);error.code=response.code;error.requestId=response.requestId;throw error}const result=response&&response.result;if(!result){const error=new Error('catalog 云函数没有返回结果，请检查云函数日志和部署版本');error.requestId=response&&response.requestId;throw error}if(typeof result==='string'){try{return JSON.parse(result)}catch(error){throw new Error(`catalog 返回了无法解析的数据：${result.slice(0,120)}`)}}return result})}
function values(){const f=new FormData($('#form'));const n=k=>Number(f.get(k)||0);const measureUnit=f.get('measureUnit')==='ml'?'ml':'g';const servingAmount=n('servingAmount');return {name:f.get('name'),aliases:f.get('aliases'),category:f.get('category'),cuisine:f.get('cuisine'),slot:f.get('slot'),servingAmount,measureUnit,servingGrams:measureUnit==='g'?servingAmount:0,servingUnit:f.get('servingUnit'),description:f.get('description'),imageUrl:f.get('imageUrl'),tags:String(f.get('tags')||'').split(/[,，]/),allergens:String(f.get('allergens')||'').split(/[,，]/),nutrition:{kcal:n('kcal'),protein:n('protein'),carbs:n('carbs'),fat:n('fat'),fiber:n('fiber')}}}
function showImage(url){const preview=$('#imagePreview');preview.src=url||'';preview.hidden=!url}
function fill(item){editing=item?item._id:null;$('#formTitle').textContent=(item?'编辑':'新增')+(type==='dish'?'菜品':'食物');const f=$('#form');const description=item?.description||'';const inferredUnit=item?.measureUnit||(/\d+(?:\.\d+)?\s*ml\b/i.test(description)&&!/\d+(?:\.\d+)?\s*g\b/i.test(description.replace(/\d+(?:\.\d+)?\s*ml\b/gi,''))?'ml':'g');const describedAmount=(description.match(inferredUnit==='ml'?/\d+(?:\.\d+)?\s*ml\b/gi:/\d+(?:\.\d+)?\s*g\b/gi)||[]).reduce((sum,value)=>sum+Number.parseFloat(value),0);Object.entries({name:item?.name||'',aliases:(item?.aliases||[]).join(','),category:item?.category||'',cuisine:item?.cuisine||'',slot:item?.slot||'all',servingAmount:item?.servingAmount||(inferredUnit==='g'?item?.servingGrams:describedAmount)||100,measureUnit:inferredUnit,servingUnit:item?.servingUnit||'标准份',description,imageUrl:item?.imageUrl||'',tags:(item?.tags||[]).join(','),allergens:(item?.allergens||[]).join(','),kcal:item?.nutrition?.kcal||0,protein:item?.nutrition?.protein||0,carbs:item?.nutrition?.carbs||0,fat:item?.nutrition?.fat||0,fiber:item?.nutrition?.fiber||0}).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});$('#imageFile').value='';showImage(item?.displayImageUrl||item?.imageUrl||'')}
function fileDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('无法读取所选图片'));reader.readAsDataURL(file)})}
async function uploadImage(){const file=$('#imageFile').files[0];if(!file)return $('#form').elements.imageUrl.value;if(file.size>2*1024*1024)throw new Error('图片大小不能超过 2MB');const result=await call({action:'uploadImage',type,dataUrl:await fileDataUrl(file)});if(!result.ok)throw new Error(result.message||'图片上传失败');$('#form').elements.imageUrl.value=result.fileID;showImage(result.displayImageUrl||result.fileID);return result.fileID}
async function load(){const r=await call({action:'list',type,keyword:$('#keyword').value,cuisine:$('#cuisineFilter').value,status:$('#statusFilter').value,page,pageSize});if(!r.ok)throw Error(r.message);total=Number(r.total)||0;page=Number(r.page)||page;$('#rows').innerHTML=(r.items||[]).map(i=>`<tr><td><strong>${i.name}</strong><br><span class="muted">${i.imageUrl?'已配置图片 · ':''}${(i.aliases||[]).join('、')}</span></td><td>${i.category||'-'}<br><span class="muted">${i.cuisine||'-'}</span></td><td>${i.nutrition?.kcal||0} kcal<br><span class="muted">蛋白质 ${i.nutrition?.protein||0}g</span></td><td><span class="status ${i.status==='offline'?'offline':''}">${i.status==='offline'?'已下架':'已上架'}</span></td><td class="row-actions"><button data-edit='${JSON.stringify(i).replace(/'/g,'&#39;')}'>编辑</button><button data-toggle="${i._id}" data-status="${i.status}">${i.status==='offline'?'上架':'下架'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">没有符合条件的数据。</td></tr>';const pages=Math.max(Math.ceil(total/pageSize),1);$('#pageInfo').textContent=`共 ${total} 条 · 第 ${page}/${pages} 页`;$('#prevPage').disabled=page<=1;$('#nextPage').disabled=page>=pages;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>fill(JSON.parse(b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await call({action:'toggle',type,id:b.dataset.toggle,status:b.dataset.status==='offline'?'online':'offline'});load()})}
async function importBuiltin(){if(type!=='dish')return alert('请先切换到菜品库');if(!confirm('将内置菜品新增或更新到云端菜品库，是否继续？'))return;const button=$('#importBuiltin'),original=button.textContent;button.disabled=true;try{const response=await fetch('./builtin-dishes.json',{cache:'no-store'});if(!response.ok)throw new Error('无法读取内置菜品文件');const items=await response.json();let completed=0;for(let index=0;index<items.length;index+=20){const batch=items.slice(index,index+20);button.textContent=`导入中 ${completed}/${items.length}`;const result=await call({action:'bulkUpsert',type:'dish',items:batch});if(!result.ok)throw new Error(result.message||'批量导入失败');completed+=result.count||batch.length}button.textContent=`已导入 ${completed} 条`;await load();alert(`导入完成：${completed} 条菜品已新增或更新。`)}catch(error){alert(errorText(error))}finally{button.disabled=false;setTimeout(()=>{button.textContent=original},1500)}}
$('#form').onsubmit=async e=>{e.preventDefault();try{await uploadImage();const r=await call({action:'save',type,id:editing,item:values()});if(!r.ok)return alert(r.message);fill(null);load()}catch(error){alert(errorText(error))}};$('#imageFile').onchange=()=>{const file=$('#imageFile').files[0];if(file)showImage(URL.createObjectURL(file))};$('#form').elements.imageUrl.oninput=e=>showImage(e.target.value);$('#cancel').onclick=()=>fill(null);$('#newItem').onclick=()=>fill(null);$('#refresh').onclick=()=>{page=1;load().catch(error=>{notice.textContent=errorText(error)})};$('#importBuiltin').onclick=importBuiltin;$('#keyword').onkeydown=e=>{if(e.key==='Enter'){page=1;load().catch(error=>{notice.textContent=errorText(error)})}};$('#cuisineFilter').onchange=$('#statusFilter').onchange=()=>{page=1;load().catch(error=>{notice.textContent=errorText(error)})};$('#pageSize').onchange=e=>{pageSize=Number(e.target.value)||20;page=1;load()};$('#prevPage').onclick=()=>{if(page>1){page-=1;load()}};$('#nextPage').onclick=()=>{if(page*pageSize<total){page+=1;load()}};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');type=b.dataset.type;page=1;$('#importBuiltin').hidden=type!=='dish';$('#cuisineFilter').hidden=type!=='dish';fill(null);load().catch(error=>{notice.textContent=errorText(error)})});withTimeout(app.auth().signInAnonymously()).then(()=>{notice.textContent='已登录，正在读取 catalog 云函数…';$('#user').textContent='已登录';return load()}).then(()=>{notice.remove();$('#user').textContent='已连接'}).catch(error=>{notice.textContent=errorText(error);$('#user').textContent='连接失败';console.error('CloudBase initialization failed',error)})
</script></body></html>
